<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ServiceFlow</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Top Header -->
    <header class="header-bar">
      <div class="service-title-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
        <span class="service-title">Недільне служіння</span>
      </div>
      <div class="header-actions">
        <div id="liveBadge" class="live-badge hidden">
          <div class="live-dot"></div> LIVE
        </div>
        <button id="roleToggleBtn" class="role-btn">Глядач</button>
      </div>
    </header>

    <!-- Active Item Hero -->
    <section class="active-card">
      <div class="card-top">
        <div class="card-category">
          <div id="heroIconWrap" class="cat-icon"></div>
          <span id="heroType">Завантаження...</span>
        </div>
        <div id="heroCounter" class="card-counter">0 з 0</div>
      </div>
      
      <h1 class="card-title" id="heroTitle">Підключення до сервера</h1>
      <div class="card-note" id="heroNote"></div>

      <!-- Admin Controls -->
      <div id="adminControls" class="card-controls hidden">
        <button id="prevBtn" class="btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="nextBtn" class="btn-primary">
          <span>Наступний пункт</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
    </section>

    <!-- List -->
    <section class="list-section">
      <div class="list-header">
        <span class="list-title">Програма</span>
        <span id="syncStatus" class="sync-status">Синхронізація...</span>
      </div>
      <div id="itemsContainer" class="items-list">
        <!-- Rendered items -->
      </div>
    </section>

    <!-- Floating Admin Toolbar -->
    <div id="floatingToolbar" class="floating-toolbar hidden">
      <button id="toggleLiveBtn" class="tool-btn text-alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span id="toggleLiveText">Почати служіння</span>
      </button>
      <div class="divider"></div>
      <button class="tool-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Додати
      </button>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
