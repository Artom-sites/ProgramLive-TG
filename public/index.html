<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ProgramLive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title" id="headerTitle">Програма</div>
    <div class="header-actions">
      <div id="liveBadge" class="badge-live hidden"><div class="pulse-square"></div> LIVE</div>
      <button id="btnSettings" class="btn-icon hidden" style="background:none;border:none;color:var(--tg-text);font-size:1.2rem;cursor:pointer;">⚙️</button>
      <button id="btnShare" class="btn-icon hidden" style="background:none;border:none;color:var(--tg-text);font-size:1.2rem;cursor:pointer;margin-left:8px;">📤</button>
    </div>
  </header>

  <div id="timeline" class="timeline"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="margin:0;">Налаштування</h3>
        <button class="btn-close" onclick="document.getElementById('settingsModal').classList.remove('active')">×</button>
      </div>
      <div class="form-group">
        <label>Назва програми</label>
        <input type="text" id="settingsTitle" class="input-field">
      </div>
      <button class="btn-small primary" id="btnSaveSettings" style="width:100%; padding:12px;">Зберегти</button>
    </div>
  </div>

  <div id="bottomBar" class="bottom-bar hidden">
    <button id="btnPrev" class="action-btn btn-ctrl">НАЗАД</button>
    <button id="btnLive" class="action-btn btn-live">START LIVE</button>
    <button id="btnNext" class="action-btn btn-ctrl">ДАЛІ</button>
  </div>

  <!-- Info Modal (Chords/Text) -->
  <div id="contentModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Матеріали</div>
      <button class="btn-close" onclick="document.getElementById('contentModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title">Редагувати пункт</div>
      <button class="btn-close" onclick="document.getElementById('editModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content form-layout">
      <input type="hidden" id="editIndex">
      <input type="hidden" id="editItemId">
      <div class="form-row">
        <label style="flex:2">Назва <input id="editTitle" type="text"></label>
        <label style="flex:1">Тип 
          <select id="editType" style="width:100%; padding:8px; border-radius:8px; background:var(--tg-bg); color:var(--tg-text); border:1px solid rgba(128,128,128,0.2); margin-top:4px;">
            <option value="standard">Звичайний</option>
            <option value="music">🎵 Пісня</option>
            <option value="prayer">🙏 Молитва</option>
            <option value="sermon">📖 Проповідь</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <label style="flex:1">Відповідальний <input id="editAssignee" type="text"></label>
        <label style="flex:1">Час (хв) <input id="editDuration" type="number"></label>
      </div>
      <label>Нотатки для Звуку <input id="editSound" type="text"></label>
      <label>Нотатки для Медіа <input id="editMedia" type="text"></label>
      <label>Акорди / Текст <textarea id="editChords" rows="3"></textarea></label>

      <div class="section-label">Прикріплені файли</div>
      <div id="editAttachmentsList" class="attachments-list"></div>
      <label class="btn-upload-wrap">
        <input type="file" id="fileInput" accept="*/*" style="display:none" onchange="handleFileUpload(this)">
        <div class="btn-upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Додати файл з пристрою
        </div>
      </label>
      <div id="uploadProgress" class="upload-progress hidden">⏳ Завантаження...</div>

      <button id="btnSaveEdit" class="btn-primary" style="width: 100%; margin-top:16px;">Зберегти зміни</button>
    </div>
  </div>


  <script src="app.js"></script>
</body>
</html>
