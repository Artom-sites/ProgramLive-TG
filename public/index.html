<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ProgramLive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title" id="headerTitle" style="cursor:pointer; display:flex; align-items:center; gap:6px;">Програма</div>
    <div class="header-actions">
      <div id="liveBadge" class="badge-live hidden"><div class="pulse-square"></div> LIVE</div>
      <button id="btnShare" class="btn-icon hidden" aria-label="Поділитися">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      </button>
    </div>
  </header>

  <div id="timeline" class="timeline"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title">Налаштування програми</div>
      <button class="btn-close" onclick="document.getElementById('settingsModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content">
      <div class="form-group-modern">
        <label>Назва програми</label>
        <input type="text" id="settingsTitle" placeholder="Недільне зібрання">
      </div>
      <button class="btn-primary" id="btnSaveSettings" style="width:100%; padding:14px; margin-top: 16px;">Зберегти</button>
    </div>
  </div>

  <div id="bottomBar" class="bottom-bar hidden">
    <button id="btnPrev" class="action-btn btn-ctrl">НАЗАД</button>
    <button id="btnLive" class="action-btn btn-live">START LIVE</button>
    <button id="btnNext" class="action-btn btn-ctrl">ДАЛІ</button>
  </div>

  <!-- Info Modal (Chords/Text) -->
  <div id="contentModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Матеріали</div>
      <button class="btn-close" onclick="document.getElementById('contentModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title">Редагувати пункт</div>
      <button class="btn-close" onclick="document.getElementById('editModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content form-layout">
      <input type="hidden" id="editIndex">
      <input type="hidden" id="editItemId">
      
      <div class="form-group-modern">
        <label>Назва</label>
        <input id="editTitle" type="text" placeholder="Наприклад: Вступне слово">
      </div>
      
      <div class="form-group-modern">
        <label>Тип пункту</label>
        <select id="editType">
          <option value="standard">Звичайний</option>
          <option value="song">🎵 Пісня</option>
          <option value="solo">🎤 Соло</option>
          <option value="ensemble">👥 Ансамбль</option>
          <option value="orchestra">🎻 Оркестр</option>
          <option value="choir">🎼 Хор</option>
          <option value="prayer">🙏 Молитва</option>
          <option value="sermon">📖 Проповідь</option>
        </select>
      </div>

      <div class="form-row" style="gap: 12px; margin-bottom: 16px;">
        <div class="form-group-modern" style="flex:2; margin-bottom: 0;">
          <label>Відповідальний</label>
          <input id="editAssignee" type="text" placeholder="Ім'я">
        </div>
        <div class="form-group-modern" style="flex:1; margin-bottom: 0;">
          <label>Час (хв)</label>
          <input id="editDuration" type="number" min="1">
        </div>
      </div>
      
      <div class="form-group-modern">
        <label>Акорди / Текст</label>
        <textarea id="editChords" rows="3" placeholder="Вставте текст пісні або акорди..."></textarea>
      </div>

      <details class="advanced-settings">
        <summary>Додаткові нотатки (Звук/Медіа)</summary>
        <div class="form-group-modern" style="margin-top: 12px;">
          <label>Для Звукорежисера</label>
          <input id="editSound" type="text" placeholder="Мікрофони, плейбек...">
        </div>
        <div class="form-group-modern">
          <label>Для Медіа</label>
          <input id="editMedia" type="text" placeholder="Слайди, відео...">
        </div>
      </details>

      <div class="section-label" style="margin-top:20px;">Прикріплені файли</div>
      <div id="editAttachmentsList" class="attachments-list"></div>
      <label class="btn-upload-wrap">
        <input type="file" id="fileInput" accept="*/*" style="display:none" onchange="handleFileUpload(this)">
        <div class="btn-upload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Додати файл з пристрою
        </div>
      </label>
      <div id="uploadProgress" class="upload-progress hidden">⏳ Завантаження...</div>

      <button id="btnSaveEdit" class="btn-primary" style="width: 100%; margin-top:24px; padding: 14px;">Зберегти зміни</button>
    </div>
  </div>


  <script src="app.js"></script>
</body>
</html>
