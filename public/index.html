<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ProgramLive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-title">Служіння</div>
    <div class="header-actions">
      <div id="liveBadge" class="badge-live hidden"><div class="pulse-square"></div> LIVE</div>
      <button id="roleToggle" class="role-toggle">ГЛЯДАЧ</button>
    </div>
  </header>

  <div id="timeline" class="timeline"></div>

  <div id="bottomBar" class="bottom-bar hidden">
    <button id="btnPrev" class="action-btn btn-ctrl">НАЗАД</button>
    <button id="btnLive" class="action-btn btn-live">START LIVE</button>
    <button id="btnNext" class="action-btn btn-ctrl">ДАЛІ</button>
  </div>

  <!-- Info Modal (Chords/Text) -->
  <div id="contentModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Матеріали</div>
      <button class="btn-close" onclick="document.getElementById('contentModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title">Редагувати пункт</div>
      <button class="btn-close" onclick="document.getElementById('editModal').classList.remove('open')">&times;</button>
    </div>
    <div class="modal-content form-layout">
      <input type="hidden" id="editIndex">
      <label>Назва <input id="editTitle" type="text"></label>
      <div class="form-row">
        <label style="flex:1">Відповідальний <input id="editAssignee" type="text"></label>
        <label style="flex:1">Час (хв) <input id="editDuration" type="number"></label>
      </div>
      <label>Нотатки для Звуку <input id="editSound" type="text"></label>
      <label>Нотатки для Медіа <input id="editMedia" type="text"></label>
      <label>Акорди / Текст <textarea id="editChords" rows="4"></textarea></label>
      <button id="btnSaveEdit" class="btn-primary" style="width: 100%; margin-top:16px;">Зберегти зміни</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
