<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ProgramLive</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-title">Неділя 10:00</div>
    <div class="header-actions">
      <div id="liveBadge" class="badge-live hidden">
        <div class="pulse-square"></div> LIVE
      </div>
      <button id="roleToggle" class="role-toggle">ГЛЯДАЧ</button>
    </div>
  </header>

  <!-- Timeline / Program -->
  <div id="timeline" class="timeline">
    <!-- Items rendered here via JS -->
  </div>

  <!-- Bottom Admin Bar -->
  <div id="bottomBar" class="bottom-bar hidden">
    <button id="btnPrev" class="action-btn btn-ctrl">НАЗАД</button>
    <button id="btnLive" class="action-btn btn-live">START LIVE</button>
    <button id="btnNext" class="action-btn btn-ctrl">ДАЛІ</button>
  </div>

  <!-- Content Modal (For chords/text) -->
  <div id="contentModal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Матеріали</div>
      <button class="btn-close" id="btnCloseModal">&times;</button>
    </div>
    <div class="modal-content" id="modalBody"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
